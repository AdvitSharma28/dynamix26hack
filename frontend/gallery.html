<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery</title>
    <meta name="description"
        content="An immersive 3D image gallery with fish-eye distortion, cloth physics, and satisfying scroll interactions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f1ec;
            font-family: 'Playfair Display', 'Georgia', serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        body.is-dragging {
            cursor: grabbing;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        .title-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
            will-change: transform, opacity;
            transition: opacity 0.4s ease;
        }

        .title-overlay h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 400;
            color: #2a2520;
            letter-spacing: 0.04em;
            line-height: 1.25;
        }

        .title-overlay .subtitle {
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            color: #8a8078;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 1rem;
            font-style: italic;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: #f4f1ec;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-bar-container {
            width: 160px;
            height: 2px;
            background: #ddd5cb;
            border-radius: 1px;
            overflow: hidden;
            margin-top: 2rem;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: #2a2520;
            border-radius: 1px;
            transition: width 0.3s ease;
        }

        .loading-text {
            font-size: 0.8rem;
            color: #8a8078;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 1rem;
        }

        .scroll-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: #a09890;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .scroll-hint.hidden {
            opacity: 0;
        }
    </style>
</head>

<body>

    <div class="loading-screen" id="loadingScreen">
        <h1 style="font-size: 1.5rem; font-weight: 400; color: #2a2520; letter-spacing: 0.04em;">
            indian<br>gallery
        </h1>
        <div class="loading-bar-container">
            <div class="loading-bar" id="loadingBar"></div>
        </div>
        <div class="loading-text" id="loadingText">Loading</div>
    </div>

    <div class="title-overlay" id="titleOverlay">
        <h1>indian<br>gallery</h1>
        <p class="subtitle">Click & drag to explore</p>
    </div>

    <div class="scroll-hint" id="scrollHint">Drag to explore</div>

    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        (function () {
            'use strict';

            const CONFIG = {

                radius: 520,
                cols: 10,
                rows: 8,

                cardWidth: 128,
                cardHeight: 168,
                cardSegments: 22,
                gapY: 55,
                brickOffset: 0.5,

                scrollSensitivity: 0.0028,
                scrollYSensitivity: 0.55,
                friction: 0.935,
                momentumScale: 16,
                minVelocity: 0.00001,

                parallaxStrength: 0.18,
                parallaxSmooth: 0.045,

                fadeOpacity: 0.55,
                hoverOpacity: 1.0,
                hoverScale: 1.09,
                hoverSmooth: 0.07,

                clothForceMax: 45,
                clothDecay: 3.5,
                clothFreq: 9.0,
                clothHoverForce: 12,

                squishStrength: 35,
                squishDecay: 0.88,

                fisheyeStrength: 0.2,
                vignetteStrength: 0.65,
                grainStrength: 0.018,

                bgColor: 0xf4f1ec,
            };

            const imageVertexShader =  `
            uniform float uForceStrength;
            uniform vec2  uForcePoint;
            uniform float uTime;
            uniform float uHover;
            uniform float uSquish;

            varying vec2  vUv;
            varying float vDeform;

            void main() {
                vUv = uv;
                vec3 pos = position;

                // ── Corner weight: 0 at corners/edges, 1 at center ──
                float ex = min(uv.x, 1.0 - uv.x) * 2.0;
                float ey = min(uv.y, 1.0 - uv.y) * 2.0;
                float cornerW = smoothstep(0.0, 0.45, ex) * smoothstep(0.0, 0.45, ey);

                // ── Cloth force from interaction point ──
                float dist = distance(uv, uForcePoint);
                float falloff = exp(-dist * dist * 5.0);
                float deform = falloff * cornerW * uForceStrength;
                pos.z += deform;
                vDeform = deform;

                // ── Subtle cloth wave on hover ──
                float wave1 = sin(uv.x * 6.2832 * 1.5 + uTime * 2.2) * 0.6;
                float wave2 = cos(uv.y * 6.2832 * 2.0 + uTime * 1.8) * 0.4;
                pos.z += (wave1 + wave2) * cornerW * uHover * 1.8;

                // ── Idle breathing ──
                pos.z += sin(uTime * 0.6 + float(gl_VertexID) * 0.001) * 0.3;

                // ── Squishy cylinder push ──
                pos.z += uSquish * cornerW;

                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

            const imageFragmentShader =  `
            uniform sampler2D uTexture;
            uniform float uOpacity;
            uniform float uHover;
            uniform float uDrag;
            uniform float uForceStrength;
            uniform bool  uTexLoaded;

            varying vec2  vUv;
            varying float vDeform;

            void main() {
                vec3 color = vec3(0.957, 0.945, 0.925); // Fallback bg

                if (uTexLoaded) {
                    // Sample texture directly using vUv (no border)
                    vec4 tex = texture2D(uTexture, vUv);

                    // Combine hover and drag for vividness
                    float vivid = clamp(uHover + uDrag * 0.7, 0.0, 1.0);

                    // Desaturation when not interacted
                    float lum = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
                    float sat = 0.35 + vivid * 0.65;
                    color = mix(vec3(lum) * 1.05, tex.rgb, sat);

                    // Slight warm tint when desaturated
                    color += (1.0 - sat) * vec3(0.02, 0.01, -0.01);

                    // Brightness boost
                    color += uHover * 0.04 + (uDrag * 0.02);

                    // Depth shading from cloth deform
                    color *= 1.0 - clamp(abs(vDeform) * 0.004, 0.0, 0.15);
                }

                // ── Card edge softness ──
                float edgeX = smoothstep(0.0, 0.008, vUv.x) * smoothstep(1.0, 0.992, vUv.x);
                float edgeY = smoothstep(0.0, 0.008, vUv.y) * smoothstep(1.0, 0.992, vUv.y);

                // ── Bottom shadow for depth ──
                float shadow = smoothstep(0.0, 0.06, vUv.y);
                color *= 0.97 + 0.03 * shadow;

                gl_FragColor = vec4(color, uOpacity * edgeX * edgeY);
            }
        `;

            const postVertexShader =  `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position.xy, 0.0, 1.0);
            }
        `;

            const postFragmentShader =  `
            uniform sampler2D tDiffuse;
            uniform float uDistortion;
            uniform float uVignette;
            uniform float uGrain;
            uniform float uTime;
            uniform vec2  uResolution;

            varying vec2 vUv;

            // Simple noise
            float rand(vec2 co) {
                return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453);
            }

            void main() {
                vec2 centered = vUv - 0.5;
                float r2 = dot(centered, centered);

                // ── Barrel distortion (fish-eye) ──
                float f = 1.0 / (1.0 + r2 * uDistortion);
                vec2 distUv = 0.5 + centered * f;

                // Clamp to valid range
                vec4 color;
                if (distUv.x < 0.0 || distUv.x > 1.0 || distUv.y < 0.0 || distUv.y > 1.0) {
                    color = vec4(0.957, 0.945, 0.925, 1.0); // bg color
                } else {
                    color = texture2D(tDiffuse, distUv);
                }

                // ── Vignette ──
                float vig = 1.0 - r2 * uVignette;
                vig = smoothstep(0.0, 1.0, vig);
                color.rgb *= vig;

                // ── Film grain ──
                float grain = rand(vUv * uResolution + fract(uTime * 1.7)) - 0.5;
                color.rgb += grain * uGrain;

                // ── Very subtle chromatic aberration at edges ──
                float ca = r2 * 0.0008;
                color.r = texture2D(tDiffuse, 0.5 + (distUv - 0.5) * (1.0 + ca)).r * vig;
                color.b = texture2D(tDiffuse, 0.5 + (distUv - 0.5) * (1.0 - ca)).b * vig;

                // Re-apply grain on adjusted channels
                color.rgb += grain * uGrain * 0.5;

                gl_FragColor = color;
            }
        `;

            class Gallery3D {
                constructor() {
                    this.canvas = document.getElementById('canvas');
                    this.loadingScreen = document.getElementById('loadingScreen');
                    this.loadingBar = document.getElementById('loadingBar');
                    this.loadingText = document.getElementById('loadingText');
                    this.titleOverlay = document.getElementById('titleOverlay');
                    this.scrollHint = document.getElementById('scrollHint');

                    this.images = [];
                    this.clock = new THREE.Clock();
                    this.loadedCount = 0;
                    this.totalImages = CONFIG.cols * CONFIG.rows;
                    this.isReady = false;
                    this.hasInteracted = false;

                    this.scrollTheta = 0;
                    this.scrollY = 0;
                    this.velTheta = 0;
                    this.velY = 0;

                    this.isDragging = false;
                    this.dragAmt = 0;
                    this.dragStart = { x: 0, y: 0 };
                    this.lastMouse = { x: 0, y: 0 };
                    this.lastDragTime = 0;
                    this.recentVelocities = [];

                    this.mouseNorm = { x: 0, y: 0 };
                    this.parallax = { x: 0, y: 0 };
                    this.cylinderRot = { x: 0, y: 0, z: 0 };
                    this.cylinderInertia = 0.012;

                    this.raycaster = new THREE.Raycaster();
                    this.mouseVec = new THREE.Vector2();
                    this.hoveredMesh = null;
                    this.lastHoverUv = new THREE.Vector2(0.5, 0.5);

                    this.squishForce = 0;
                    this.dragAngle = 0;

                    this._init();
                }

                _init() {

                    this.scene = new THREE.Scene();
                    this.scene.background = new THREE.Color(CONFIG.bgColor);

                    this.camera = new THREE.PerspectiveCamera(
                        72,
                        window.innerWidth / window.innerHeight,
                        1,
                        2000
                    );
                    this.camera.position.set(0, 0, 0);

                    this.renderer = new THREE.WebGLRenderer({
                        canvas: this.canvas,
                        antialias: true,
                        alpha: false,
                    });
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    this.renderer.outputEncoding = THREE.sRGBEncoding;

                    this.imageGroup = new THREE.Group();
                    this.scene.add(this.imageGroup);

                    this._setupPostProcessing();

                    this._createImages();

                    this._setupEvents();

                    this._animate();
                }

                _setupPostProcessing() {
                    const dpr = Math.min(window.devicePixelRatio, 2);
                    this.renderTarget = new THREE.WebGLRenderTarget(
                        window.innerWidth * dpr,
                        window.innerHeight * dpr
                    );

                    this.postScene = new THREE.Scene();
                    this.postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

                    this.postMaterial = new THREE.ShaderMaterial({
                        uniforms: {
                            tDiffuse: { value: this.renderTarget.texture },
                            uDistortion: { value: CONFIG.fisheyeStrength },
                            uVignette: { value: CONFIG.vignetteStrength },
                            uGrain: { value: CONFIG.grainStrength },
                            uTime: { value: 0 },
                            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                        },
                        vertexShader: postVertexShader,
                        fragmentShader: postFragmentShader,
                        depthTest: false,
                        depthWrite: false,
                    });

                    const quad = new THREE.Mesh(
                        new THREE.PlaneGeometry(2, 2),
                        this.postMaterial
                    );
                    this.postScene.add(quad);
                }

                _createImages() {
                    const loader = new THREE.TextureLoader();
                    loader.crossOrigin = 'anonymous';

                    const angleStep = (Math.PI * 2) / CONFIG.cols;

                    const seeds = [
                        'asset/images/FESTIVALS/diwali.avif',
                        'asset/images/FESTIVALS/durgapooja.avif',
                        'asset/images/FESTIVALS/EID.jpg',
                        'asset/images/FESTIVALS/ganeshchaturthi.avif',
                        'asset/images/FESTIVALS/holi.avif',
                        'asset/images/FESTIVALS/janmasthmi.avif',
                        'asset/images/FESTIVALS/Navratri (1).jpg',
                        'asset/images/FESTIVALS/onam.webp',
                        'asset/images/FESTIVALS/Pongal_fest.jpg',
                        'asset/images/FESTIVALS/Sankranti.avif',
                        'asset/images/Food/biryani.jpg',
                        'asset/images/Food/Butter chicken.jpg',
                        'asset/images/Food/Dosa.jpg',
                        'asset/images/Food/Kachori.jpg',
                        'asset/images/Food/Kulche.jpg',
                        'asset/images/Food/Panipuri.jpg',
                        'asset/images/Food/Pav Bhaji.jpg',
                        'asset/images/Food/Puri.jpg',
                        'asset/images/Food/Samose.jpg',
                        'asset/images/Indian cities/Bombay.jpg',
                        'asset/images/Indian cities/Gurgaon.jpg',
                        'asset/images/Indian cities/Hyderabad.jpg',
                        'asset/images/Indian cities/Kerela.jpg',
                        'asset/images/Indian cities/Maharashtra waterfall.jpg',
                        'asset/images/Indian cities/Uttrakhand city.jpg',
                        'asset/images/Monuments/bhawanpalace.jpg',
                        'asset/images/Monuments/charminar.jpg',
                        'asset/images/Monuments/hawa mahal.jpg',
                        'asset/images/Monuments/Humayun Tomb.jpg',
                        'asset/images/Monuments/India Gate.jpg',
                        'asset/images/Monuments/jantar mantar.jpg',
                        'asset/images/Monuments/Khajuraho.jpg',
                        'asset/images/Monuments/statue of unity.jpg',
                        'asset/images/Monuments/Taj Mahal.jpg'
                    ];

                    for (let row = 0; row < CONFIG.rows; row++) {
                        for (let col = 0; col < CONFIG.cols; col++) {
                            const idx = row * CONFIG.cols + col;

                            const geo = new THREE.PlaneGeometry(
                                CONFIG.cardWidth,
                                CONFIG.cardHeight,
                                CONFIG.cardSegments,
                                CONFIG.cardSegments
                            );

                            const mat = new THREE.ShaderMaterial({
                                uniforms: {
                                    uTexture: { value: null },
                                    uTexLoaded: { value: false },
                                    uOpacity: { value: CONFIG.fadeOpacity },
                                    uHover: { value: 0 },
                                    uDrag: { value: 0 },
                                    uForceStrength: { value: 0 },
                                    uForcePoint: { value: new THREE.Vector2(0.5, 0.5) },
                                    uTime: { value: 0 },
                                    uSquish: { value: 0 },
                                },
                                vertexShader: imageVertexShader,
                                fragmentShader: imageFragmentShader,
                                transparent: true,
                                side: THREE.DoubleSide,
                                depthWrite: true,
                            });

                            const mesh = new THREE.Mesh(geo, mat);

                            const brickShift = (row % 2) * angleStep * CONFIG.brickOffset;
                            const theta = col * angleStep + brickShift;

                            const x = CONFIG.radius * Math.sin(theta);
                            const z = -CONFIG.radius * Math.cos(theta);
                            const y = (row - CONFIG.rows / 2 + 0.5) * (CONFIG.cardHeight + CONFIG.gapY);

                            mesh.position.set(x, y, z);
                            mesh.rotation.y = -theta;

                            mesh.rotation.z = (Math.random() - 0.5) * 0.025;

                            const baseScale = 0.92 + Math.random() * 0.16;
                            mesh.scale.set(baseScale, baseScale, baseScale);

                            mesh.userData = {
                                col, row, idx,
                                baseTheta: theta,
                                baseY: y,
                                baseScale,
                                hoverAmt: 0,
                                forceAtRelease: 0,
                                forceStr: 0,
                                forceReleaseT: 0,
                                isForceActive: false,
                                squishAmt: 0,
                                targetSquish: 0,
                            };

                            this.imageGroup.add(mesh);
                            this.images.push(mesh);

                            const imgUrl = seeds[idx % seeds.length];

                            loader.load(
                                imgUrl,
                                (tex) => {
                                    tex.minFilter = THREE.LinearMipmapLinearFilter;
                                    tex.magFilter = THREE.LinearFilter;
                                    tex.generateMipmaps = true;
                                    mat.uniforms.uTexture.value = tex;
                                    mat.uniforms.uTexLoaded.value = true;
                                    this._onImageLoaded();
                                },
                                undefined,
                                () => this._onImageLoaded()
                            );
                        }
                    }
                }

                _onImageLoaded() {
                    this.loadedCount++;
                    const pct = Math.min((this.loadedCount / this.totalImages) * 100, 100);
                    this.loadingBar.style.width = pct + '%';
                    this.loadingText.textContent = `${Math.round(pct)}%`;

                    if (this.loadedCount >= Math.min(this.totalImages, 24) && !this.isReady) {
                        this.isReady = true;
                        this.loadingScreen.classList.add('hidden');
                        setTimeout(() => { this.loadingScreen.style.display = 'none'; }, 1000);
                    }
                }

                _setupEvents() {
                    this.canvas.addEventListener('mousedown', this._onPointerDown.bind(this));
                    window.addEventListener('mousemove', this._onPointerMove.bind(this));
                    window.addEventListener('mouseup', this._onPointerUp.bind(this));

                    this.canvas.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        const t = e.touches[0];
                        this._onPointerDown({ clientX: t.clientX, clientY: t.clientY });
                    }, { passive: false });

                    window.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        const t = e.touches[0];
                        this._onPointerMove({ clientX: t.clientX, clientY: t.clientY });
                    }, { passive: false });

                    window.addEventListener('touchend', () => this._onPointerUp());
                    window.addEventListener('resize', this._onResize.bind(this));
                }

                _onPointerDown(e) {
                    this.isDragging = true;
                    this.dragStart = { x: e.clientX, y: e.clientY };
                    this.lastMouse = { x: e.clientX, y: e.clientY };
                    this.lastDragTime = performance.now();
                    this.recentVelocities = [];
                    document.body.classList.add('is-dragging');

                    if (!this.hasInteracted) {
                        this.hasInteracted = true;
                        this.scrollHint.classList.add('hidden');
                    }
                }

                _onPointerMove(e) {
                    const mx = e.clientX;
                    const my = e.clientY;

                    this.mouseNorm.x = (mx / window.innerWidth) * 2 - 1;
                    this.mouseNorm.y = (my / window.innerHeight) * 2 - 1;

                    this.mouseVec.x = (mx / window.innerWidth) * 2 - 1;
                    this.mouseVec.y = -(my / window.innerHeight) * 2 + 1;

                    if (this.isDragging) {
                        const now = performance.now();
                        const dt = Math.max(now - this.lastDragTime, 1);
                        const dx = mx - this.lastMouse.x;
                        const dy = my - this.lastMouse.y;

                        this.scrollTheta += dx * CONFIG.scrollSensitivity;
                        this.scrollY -= dy * CONFIG.scrollYSensitivity;

                        this.recentVelocities.push({ vx: dx / dt, vy: -dy / dt, t: now });
                        while (this.recentVelocities.length > 6) this.recentVelocities.shift();

                        const speed = Math.sqrt(dx * dx + dy * dy);
                        this.squishForce = Math.min(speed * 0.6, CONFIG.squishStrength);
                        this.dragAngle = Math.atan2(my - window.innerHeight / 2, mx - window.innerWidth / 2);

                        this.lastMouse = { x: mx, y: my };
                        this.lastDragTime = now;
                    }
                }

                _onPointerUp() {
                    if (!this.isDragging) return;
                    this.isDragging = false;
                    document.body.classList.remove('is-dragging');

                    if (this.recentVelocities.length > 0) {
                        const recent = this.recentVelocities.slice(-4);
                        let avgVx = 0, avgVy = 0;
                        for (const v of recent) { avgVx += v.vx; avgVy += v.vy; }
                        avgVx /= recent.length;
                        avgVy /= recent.length;

                        this.velTheta = avgVx * CONFIG.scrollSensitivity * CONFIG.momentumScale;
                        this.velY = avgVy * CONFIG.scrollYSensitivity * CONFIG.momentumScale;
                    }
                }

                _onResize() {
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    const dpr = Math.min(window.devicePixelRatio, 2);

                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                    this.renderTarget.setSize(w * dpr, h * dpr);
                    this.postMaterial.uniforms.uResolution.value.set(w, h);
                }

                _updateScroll() {
                    if (!this.isDragging) {
                        this.scrollTheta += this.velTheta;
                        this.scrollY += this.velY;
                        this.velTheta *= CONFIG.friction;
                        this.velY *= CONFIG.friction;

                        if (Math.abs(this.velTheta) < CONFIG.minVelocity) this.velTheta = 0;
                        if (Math.abs(this.velY) < CONFIG.minVelocity * 100) this.velY = 0;
                    }

                    this.squishForce *= CONFIG.squishDecay;

                    const totalH = CONFIG.rows * (CONFIG.cardHeight + CONFIG.gapY);
                    const halfH = totalH / 2;

                    for (const mesh of this.images) {
                        const d = mesh.userData;

                        const theta = d.baseTheta + this.scrollTheta;
                        const x = CONFIG.radius * Math.sin(theta);
                        const z = -CONFIG.radius * Math.cos(theta);

                        let y = d.baseY + this.scrollY;
                        y = ((y + halfH) % totalH + totalH) % totalH - halfH;

                        mesh.position.set(x, y, z);
                        mesh.rotation.y = -theta;

                        const viewTheta = theta % (Math.PI * 2);
                        const normTheta = ((viewTheta + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
                        const angDist = Math.abs(normTheta);
                        const yDist = Math.abs(y) / (halfH * 0.5);
                        const totalDist = Math.sqrt(angDist * angDist + yDist * yDist);
                        const squishFalloff = Math.exp(-totalDist * totalDist * 1.5);

                        d.targetSquish = this.squishForce * squishFalloff;
                        d.squishAmt += (d.targetSquish - d.squishAmt) * 0.12;
                        mesh.material.uniforms.uSquish.value = d.squishAmt;
                    }
                }

                _updateParallax() {
                    this.parallax.x += (this.mouseNorm.x * CONFIG.parallaxStrength - this.parallax.x) * CONFIG.parallaxSmooth;
                    this.parallax.y += (this.mouseNorm.y * CONFIG.parallaxStrength - this.parallax.y) * CONFIG.parallaxSmooth;

                    this.camera.rotation.y = this.parallax.x * 0.5;
                    this.camera.rotation.x = -this.parallax.y * 0.4;

                    const targetRotX = this.parallax.y * 1.2;
                    const targetRotZ = -this.parallax.x * 0.3;
                    const targetRotY = this.parallax.x * 0.6;

                    this.cylinderRot.x += (targetRotX - this.cylinderRot.x) * this.cylinderInertia;
                    this.cylinderRot.y += (targetRotY - this.cylinderRot.y) * this.cylinderInertia;
                    this.cylinderRot.z += (targetRotZ - this.cylinderRot.z) * this.cylinderInertia;

                    this.imageGroup.rotation.x = this.cylinderRot.x;
                    this.imageGroup.rotation.y = this.cylinderRot.y;
                    this.imageGroup.rotation.z = this.cylinderRot.z;
                }

                _updateHover(time) {

                    const targetDrag = this.isDragging ? 1 : 0;
                    this.dragAmt += (targetDrag - this.dragAmt) * 0.08;

                    let newHovered = null;
                    let hitUv = null;

                    if (!this.isDragging) {
                        this.raycaster.setFromCamera(this.mouseVec, this.camera);
                        const hits = this.raycaster.intersectObjects(this.images, false);
                        if (hits.length > 0) {
                            newHovered = hits[0].object;
                            hitUv = hits[0].uv;
                        }
                    }

                    this.hoveredMesh = newHovered;

                    for (const mesh of this.images) {
                        const d = mesh.userData;
                        const isHovered = mesh === this.hoveredMesh;
                        const targetH = isHovered ? 1 : 0;

                        d.hoverAmt += (targetH - d.hoverAmt) * CONFIG.hoverSmooth;
                        mesh.material.uniforms.uHover.value = d.hoverAmt;
                        mesh.material.uniforms.uDrag.value = this.dragAmt;

                        const baseOp = CONFIG.fadeOpacity + this.dragAmt * (CONFIG.hoverOpacity - CONFIG.fadeOpacity) * 0.6;
                        const targetOp = baseOp + (CONFIG.hoverOpacity - baseOp) * d.hoverAmt;
                        mesh.material.uniforms.uOpacity.value = targetOp;

                        const targetScale = d.baseScale * (1 + d.hoverAmt * (CONFIG.hoverScale - 1));
                        const cs = mesh.scale.x;
                        const ns = cs + (targetScale - cs) * CONFIG.hoverSmooth;
                        mesh.scale.set(ns, ns, ns);

                        if (isHovered && hitUv) {
                            mesh.material.uniforms.uForcePoint.value.set(hitUv.x, hitUv.y);
                            const hoverForce = CONFIG.clothHoverForce;

                            d.forceStr += (hoverForce - d.forceStr) * 0.06;
                            d.forceReleaseT = 0;
                            d.forceAtRelease = d.forceStr;
                        } else if (d.forceStr > 0.01) {

                            if (d.forceReleaseT === 0) {
                                d.forceReleaseT = time;
                                d.forceAtRelease = d.forceStr;
                            }
                            const t = time - d.forceReleaseT;
                            const damping = 0.6;
                            const omega = CONFIG.clothFreq;
                            const alpha = damping * omega;
                            const omegaD = omega * Math.sqrt(1 - damping * damping);

                            d.forceStr = d.forceAtRelease * Math.exp(-alpha * t) *
                                (Math.cos(omegaD * t) + (alpha / omegaD) * Math.sin(omegaD * t));

                            if (Math.abs(d.forceStr) < 0.01) {
                                d.forceStr = 0;
                                d.forceReleaseT = 0;
                            }
                        }

                        mesh.material.uniforms.uForceStrength.value = d.forceStr;
                        mesh.material.uniforms.uTime.value = time + d.idx * 0.3;
                    }
                }

                _updateTitle() {
                    if (!this.titleOverlay) return;

                    const speed = Math.abs(this.velTheta) * 200 + Math.abs(this.velY) * 0.05;
                    const scrollAmount = Math.abs(this.scrollTheta) * 5 + Math.abs(this.scrollY) * 0.01;
                    const titleOpacity = Math.max(0, Math.min(0.88, 0.88 - speed * 3 - scrollAmount * 0.5));
                    this.titleOverlay.style.opacity = titleOpacity;

                    const tx = -this.parallax.x * 35;
                    const ty = this.parallax.y * 25;
                    this.titleOverlay.style.transform =
                        `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;
                }

                _animate() {
                    requestAnimationFrame(this._animate.bind(this));

                    const time = this.clock.getElapsedTime();

                    this._updateScroll();
                    this._updateParallax();
                    this._updateHover(time);
                    this._updateTitle();

                    this.postMaterial.uniforms.uTime.value = time;

                    this.renderer.setRenderTarget(this.renderTarget);
                    this.renderer.render(this.scene, this.camera);

                    this.renderer.setRenderTarget(null);
                    this.renderer.render(this.postScene, this.postCamera);
                }
            }

            window.addEventListener('DOMContentLoaded', () => {
                new Gallery3D();
            });

        })();
    </script>
</body>

</html>
