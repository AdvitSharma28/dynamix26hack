<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>travel</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=EB+Garamond:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <main class="main-container">

        <aside class="floating-panel left-panel" id="left-panel">
            <h2 class="section-title">Design Your Journey</h2>

            <div class="map-helper">
                <span>Click the map to drop your <strong>Source</strong> and <strong>Destination</strong> pins, or type
                    them below.</span>
            </div>

            <form id="planner-form">
                <div class="form-group">
                    <label for="source">Source</label>
                    <input type="text" id="source" placeholder="e.g. Gurgaon" required>
                </div>

                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input type="text" id="destination" placeholder="e.g. Mumbai" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="departDate">Depart Date</label>
                        <input type="date" id="departDate" required>
                    </div>
                    <div class="form-group">
                        <label for="returnDate">Return Date</label>
                        <input type="date" id="returnDate" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="budgetMin">Min Budget (₹)</label>
                        <input type="number" id="budgetMin" value="5000" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="budgetMax">Max Budget (₹)</label>
                        <input type="number" id="budgetMax" value="15000" min="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="travelers">Travelers</label>
                        <input type="number" id="travelers" value="2" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="preferredTransport">Transport</label>
                        <select id="preferredTransport">
                            <option value="any">Auto Pick</option>
                            <option value="flight">Flight</option>
                            <option value="train">Train</option>
                            <option value="bus">Bus</option>
                        </select>
                    </div>
                </div>

                <div id="status-indicator" class="status-indicator"></div>
                <button type="submit" id="btn-submit" class="btn-submit">Generate Itinerary</button>
            </form>
        </aside>

        <aside class="floating-panel right-panel closed" id="right-panel">
            <div class="panel-header">
                <h2 class="section-title">Your Itinerary</h2>
                <button type="button" class="close-btn" id="close-results">&times;</button>
            </div>

            <div id="result-container" class="result-container">

            </div>
        </aside>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="script.js"></script>
</body>

</html>
